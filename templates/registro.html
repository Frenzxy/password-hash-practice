<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Rajdhani:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v='2') }}">
    <title>Document</title>
</head>
<body>
    <div>
        <form action="/" method="POST">
            <h1>Registro</h1>

            <label for="username">Nombre: </label>
            <input type="text" id="username" name="username" value="{{ username or '' }}" required>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>

            <label for="password">Contraseña: </label>
            <input type="password" id="password" name="password" required>

            {% if error %}
                <p>{{ error }}</p>
            {% endif %}

            <button type="submit">Registrar</button>
        </form>
    </div>
</body>
</html>
